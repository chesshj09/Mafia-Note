<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마피아 설정노트 에디터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">

<style id="mf-core-style">
  /* ---------- 설정노트 본문 스타일 (이 블록만 티스토리로 내보내집니다) ---------- */
  .mf-scene, .mf-scene * { box-sizing: border-box; }
  .mf-scene {
    --navy: #111111;
    --navy-2: #262626;
    --paper: #f7f7f7;
    --card: #ffffff;
    --ink: #111111;
    --soft: #5e5e5e;
    --line: #d6d6d6;
    --red: #b3263a;
    --brass: #b3263a;
    --pt: 46px; --pr: 46px; --pl: 26px; --pb: 30px;

    position: relative;
    max-width: 960px;
    margin: 0 auto;
    padding: var(--pt) var(--pr) var(--pb) var(--pl);
    color: var(--ink);
    font-family: 'IBM Plex Sans KR', sans-serif;
    font-size: 14.5px;
    line-height: 1.7;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .mf-scene.mf-has-decos { --pb: 84px; }
  .mf-scene input[type="text"], .mf-scene input[type="number"] {
    border: 0; background: transparent; color: inherit; font: inherit;
    padding: 0; margin: 0; min-width: 0; border-radius: 0;
  }
  .mf-scene input[type="text"]:focus, .mf-scene input[type="number"]:focus { outline: none; }
  .mf-scene input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  .mf-scene input[type="number"]::-webkit-inner-spin-button,
  .mf-scene input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  /* 뒤에 겹쳐 놓인 파일철 */
  .mf-stack { position: absolute; z-index: 0; border: 1px solid var(--ink); border-radius: 0 14px 14px 14px; }
  .mf-stack.s1 { top: calc(var(--pt) + 8px); bottom: calc(var(--pb) + 8px); left: calc(var(--pl) + 14px); right: calc(var(--pr) - 14px); background: #d9d9d9; }
  .mf-stack.s2 { top: calc(var(--pt) + 16px); bottom: calc(var(--pb) + 16px); left: calc(var(--pl) + 28px); right: calc(var(--pr) - 28px); background: var(--red); }

  /* 앞 파일철 (탭 + 핀스트라이프 표지) */
  .mf-wrap {
    position: relative; z-index: 1;
    padding: 28px 24px 70px;
    border: 1px solid #000; border-radius: 0 14px 14px 14px;
    background: repeating-linear-gradient(90deg, var(--navy) 0, var(--navy) 11px, var(--navy-2) 11px, var(--navy-2) 12px);
  }
  .mf-tab {
    position: absolute; left: -1px; top: -37px; height: 38px; z-index: 2;
    display: flex; align-items: center; padding: 0 28px;
    background: repeating-linear-gradient(90deg, var(--navy) 0, var(--navy) 11px, var(--navy-2) 11px, var(--navy-2) 12px);
    color: #f5f5f5; border: 1px solid #000; border-bottom: 0; border-radius: 12px 12px 0 0;
  }
  .mf-family { font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 17px; letter-spacing: 0.06em; min-width: 110px; line-height: 1.4; }

  /* 파일철 안의 서류 */
  .mf-paper {
    position: relative; background: var(--paper); border-radius: 3px;
    padding: 60px 36px 0;
    box-shadow: 0 -5px 0 -2px #e4e4e4, 0 -9px 0 -4px #b9b9b9;
  }
  .mf-status {
    position: absolute; top: 16px; right: 24px; z-index: 2;
    display: inline-block; padding: 1px 14px; border: 2px solid var(--ink); border-radius: 4px;
    font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 15px; letter-spacing: 0.12em; line-height: 1.6;
    color: var(--ink); transform: rotate(4deg); opacity: 0.92; user-select: none; cursor: pointer;
  }
  .mf-status[data-status="hidden"] { color: #777777; border-color: #777777; border-style: dashed; }
  .mf-status[data-status="wanted"] { color: var(--red); border-color: var(--red); }
  .mf-status[data-status="jailed"] { color: #444444; border-style: double; border-width: 4px; padding: 0 12px; }
  .mf-status[data-status="dead"] { color: #777777; border-color: #777777; }
  .mf-status[data-status="dead"] span { text-decoration: line-through; }

  .mf-body { padding: 0 0 8px; }
  .mf-body > .mf-section:last-child { margin-bottom: 28px; }

  /* 인물 소개 */
  .mf-id { display: grid; grid-template-columns: 270px 1fr; gap: 40px; align-items: start; margin-bottom: 48px; }
  .mf-portrait { position: relative; background: var(--card); border: 1px solid var(--ink); border-radius: 10px; padding: 8px; }
  .mf-photo {
    position: relative; aspect-ratio: 3 / 4; border-radius: 5px; overflow: hidden; cursor: pointer;
    background: repeating-linear-gradient(90deg, #e8e8e8 0, #e8e8e8 9px, #dedede 9px, #dedede 10px);
  }
  .mf-photo img {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; transform-origin: center center; touch-action: none; user-select: none; cursor: grab;
  }
  .mf-photo.has-image { cursor: default; }
  .mf-photo.has-image img { display: block; }
  .mf-upload-caption {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; color: var(--soft); font-size: 13px; text-align: center; pointer-events: none;
  }
  .mf-upload-caption b { font-family: 'Nanum Myeongjo', serif; font-size: 17px; color: var(--ink); }
  .mf-photo.has-image .mf-upload-caption { display: none; }

  /* 서열 카드 모서리 (살짝 삐딱하게) */
  .mf-chip {
    position: absolute; z-index: 3; width: 52px; padding: 7px 0 7px;
    background: var(--card); border: 1px solid var(--ink); border-radius: 7px;
    display: flex; flex-direction: column; align-items: center; line-height: 1; color: var(--ink);
    box-shadow: 2px 3px 0 rgba(17,17,17,0.18);
  }
  .mf-chip[data-suit="heart"], .mf-chip[data-suit="diamond"] { color: var(--red); }
  .mf-chip.tl { left: -17px; top: -15px; transform: rotate(-11deg); }
  .mf-chip.br { right: -17px; bottom: -15px; transform: rotate(167deg); }
  .mf-rank { font-family: 'Bodoni Moda', 'Nanum Myeongjo', serif; font-weight: 700; font-size: 30px; min-width: 1ch; min-height: 1em; text-align: center; color: var(--ink); }
  .mf-suit { font-size: 26px; margin-top: 5px; line-height: 1; color: inherit; cursor: pointer; user-select: none; }
  .mf-chip.br .mf-suit { cursor: default; }

  .mf-callsign { font-family: 'Nanum Myeongjo', serif; font-weight: 700; font-size: 15px; color: var(--brass); min-height: 1.4em; }
  .mf-name { font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 44px; line-height: 1.2; margin: 2px 0 0; }
  .mf-namebox { padding-bottom: 12px; border-bottom: 4px double var(--ink); margin-bottom: 18px; }
  .mf-roman { font-family: 'Bodoni Moda', serif; font-style: italic; font-size: 17px; color: var(--soft); margin: 2px 0 0; min-height: 1.4em; }
  .mf-catch { font-weight: 600; font-size: 15px; padding: 0 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 14px; white-space: pre-wrap; }
  .mf-quote { font-family: 'Nanum Myeongjo', serif; color: var(--soft); font-size: 15px; margin: 0 0 22px; padding-left: 12px; border-left: 3px solid var(--red); white-space: pre-wrap; }

  /* 장부 줄 (기본 정보, 조직, 전투 등) */
  .mf-ledger { border-top: 1px solid var(--ink); }
  .mf-row { position: relative; display: grid; grid-template-columns: 104px 1fr; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .mf-k { color: var(--soft); font-size: 13px; padding-top: 1px; }
  .mf-v { white-space: pre-wrap; }

  /* 섹션 */
  .mf-section { margin-bottom: 44px; }
  .mf-h {
    display: flex; align-items: baseline; gap: 8px;
    font-family: 'Nanum Myeongjo', serif; font-weight: 800; font-size: 19px;
    margin: 0 0 18px; padding-bottom: 5px; border-bottom: 4px double var(--ink);
  }
  .mf-h-title { flex: 1; }
  .mf-text { white-space: pre-wrap; min-height: 1.4em; }

  /* 육각형 차트 */
  .mf-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 44px; align-items: start; }
  .mf-hex { width: 100%; max-width: 340px; height: auto; display: block; overflow: visible; margin: 0 auto 14px; }
  .mf-hex-ring { fill: none; stroke: var(--line); stroke-width: 1; }
  .mf-hex-ring.is-outer { stroke: var(--soft); stroke-width: 1.2; }
  .mf-hex-axis { stroke: var(--line); stroke-width: 1; }
  .mf-hex-area { fill: rgba(179,38,58,0.2); stroke: var(--red); stroke-width: 2; stroke-linejoin: round; }
  .mf-hex-dot { fill: var(--red); }
  .mf-hex-label { font-family: 'IBM Plex Sans KR', sans-serif; font-size: 13px; font-weight: 500; fill: var(--soft); text-anchor: middle; }
  .mf-hex-num { font-family: 'Bodoni Moda', serif; font-size: 17px; font-weight: 700; fill: var(--ink); text-anchor: middle; }
  .mf-stat-row { display: grid; grid-template-columns: 1fr 64px 26px; align-items: baseline; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .mf-stat-label { font-weight: 600; font-size: 14.5px; width: 100%; display: block; }
  .mf-stat-val { font-family: 'Bodoni Moda', serif; font-weight: 700; font-size: 22px; text-align: right; width: 100%; display: block; line-height: 1.3; }
  .mf-grade { font-family: 'Bodoni Moda', serif; font-weight: 700; font-size: 16px; color: var(--red); text-align: center; }
  .mf-stat-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 12px; font-size: 13px; color: var(--soft); }
  .mf-stat-foot b { font-family: 'Bodoni Moda', serif; font-size: 17px; color: var(--ink); }
  .mf-max { display: inline-block; width: 3.4em; text-align: right; font-weight: 600; color: var(--ink); }
  .mf-stat-note { margin-top: 18px; color: var(--soft); font-size: 13.5px; }

  /* 인간관계 */
  .mf-rels { border-top: 1px solid var(--ink); }
  .mf-rel { position: relative; display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .mf-rel-type { align-self: start; text-align: center; font-size: 12.5px; font-weight: 600; line-height: 1.6; padding: 1px 6px; border: 1px solid var(--navy); border-radius: 4px; color: var(--navy); }
  .mf-rel-name { font-weight: 600; }
  .mf-rel-memo { color: var(--soft); white-space: pre-wrap; }

  /* 연대기 */
  .mf-tls { border-top: 1px solid var(--ink); }
  .mf-tl { position: relative; display: grid; grid-template-columns: 72px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .mf-tl-year { font-family: 'Bodoni Moda', serif; font-weight: 700; font-size: 18px; line-height: 1.5; }
  .mf-tl-title { font-weight: 600; }
  .mf-tl-text { color: var(--soft); white-space: pre-wrap; }

  /* 기밀 (두 열 전체 너비) */
  .mf-secret summary {
    list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    background: var(--ink); color: #f5f5f5; padding: 10px 16px; border-radius: 4px; font-weight: 600;
  }
  .mf-secret summary::-webkit-details-marker { display: none; }
  .mf-secret summary::after { content: '펼치기'; color: #ff8a98; font-size: 12.5px; font-weight: 500; }
  .mf-secret[open] summary { border-radius: 4px 4px 0 0; }
  .mf-secret[open] summary::after { content: '접기'; }
  .mf-secret .mf-text { padding: 14px 16px; border: 1px solid var(--ink); border-top: 0; background: var(--card); border-radius: 0 0 4px 4px; }

  .mf-foot { display: flex; justify-content: space-between; gap: 12px; padding: 14px 0 18px; border-top: 1px solid var(--ink); color: var(--soft); font-size: 12.5px; }

  /* 꾸밈 요소 (테두리 없이 그림자만) */
  .mf-decos { position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none; }
  .mf-deco {
    position: absolute; transform-origin: center center;
    filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.42));
  }
  .mf-deco svg { display: block; width: 100%; height: auto; overflow: visible; }

  @media (max-width: 680px) {
    .mf-scene { --pt: 42px; --pr: 28px; --pl: 8px; }
    .mf-tab { padding: 0 18px; }
    .mf-cols { grid-template-columns: 1fr; }
    .mf-wrap { padding: 20px 10px 64px; }
    .mf-paper { padding: 58px 16px 0; }
    .mf-body { padding: 0 0 24px; }
    .mf-id { grid-template-columns: 1fr; gap: 32px; }
    .mf-portrait-col { width: 72%; max-width: 280px; margin: 0 auto; }
    .mf-name { font-size: 34px; }
    .mf-row { grid-template-columns: 84px 1fr; }
    .mf-chip.tl { left: -12px; top: -12px; }
    .mf-chip.br { right: -12px; bottom: -12px; }
    .mf-status { right: 14px; }
  }
</style>

<style id="mf-editor-style">
  /* ---------- 편집기 전용 화면 요소 (티스토리로 내보낼 때는 포함되지 않습니다) ---------- */
  * { box-sizing: border-box; }
  .mf-page { margin: 0; background: #dadada; font-family: 'IBM Plex Sans KR', sans-serif; }
  .mf-pad { padding: 24px 12px 72px; }

  .mf-scene [data-edit] { outline: none; border-radius: 3px; transition: background 0.15s; cursor: text; }
  .mf-scene [data-edit]:hover { background: rgba(179,38,58,0.07); }
  .mf-scene [data-edit]:focus { background: rgba(179,38,58,0.1); box-shadow: 0 0 0 1px var(--red); }
  .mf-scene [data-edit]:empty::before { content: attr(data-placeholder); color: #999999; pointer-events: none; }
  .mf-scene .mf-tab [data-edit]:empty::before { color: rgba(255,255,255,0.55); }
  .mf-scene .mf-tab [data-edit]:hover { background: rgba(255,255,255,0.1); }
  .mf-scene .mf-tab [data-edit]:focus { background: rgba(255,255,255,0.14); box-shadow: 0 0 0 1px #fff; }
  .mf-scene input[type="text"]:hover, .mf-scene input[type="number"]:hover { background: rgba(179,38,58,0.07); }
  .mf-scene input[type="text"]:focus, .mf-scene input[type="number"]:focus { background: rgba(179,38,58,0.1); box-shadow: 0 0 0 1px var(--red); }
  .mf-status:focus-visible, .mf-suit:focus-visible, .mf-photo:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .mf-secret summary:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* 상단 툴바 */
  .mf-toolbar {
    position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
    padding: 10px 16px; background: #111111; color: #eeeeee; font-size: 13px;
  }
  .mf-toolbar b { color: #ffffff; }
  .mf-spacer { flex: 1; }
  .mf-toolbar button, .mf-toolbar label.btn {
    background: #262626; color: #f2f2f2; border: 1px solid #555555; border-radius: 4px;
    padding: 7px 12px; font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .mf-toolbar button:hover, .mf-toolbar label.btn:hover { background: #3a3a3a; }
  .mf-toolbar button.primary { background: #b3263a; border-color: #b3263a; }
  .mf-toolbar button.primary:hover { background: #c4344a; }
  #save-status { color: #999999; font-size: 12px; }
  #import-file { display: none; }

  /* 줄 추가·삭제 */
  .mf-x {
    position: absolute; top: 7px; right: -28px; width: 22px; height: 22px; padding: 0;
    border: 0; border-radius: 50%; background: transparent; color: #888888;
    font-size: 12px; line-height: 22px; cursor: pointer; opacity: 0; transition: opacity 0.15s;
  }
  .mf-row:hover .mf-x, .mf-rel:hover .mf-x, .mf-tl:hover .mf-x, .mf-x:focus-visible { opacity: 1; }
  .mf-x:hover { color: var(--red); background: rgba(179,38,58,0.1); }
  .mf-h .mf-x { position: static; opacity: 0.6; }
  .mf-add {
    margin-top: 12px; background: none; border: 1px dashed var(--soft); color: var(--soft);
    font-family: inherit; font-size: 12.5px; padding: 5px 14px; border-radius: 999px; cursor: pointer;
  }
  .mf-add:hover { border-color: var(--red); color: var(--red); }
  .mf-add-custom { display: block; margin: 0 auto 44px; }

  /* 사진 조절 */
  #photo-input { display: none; }
  .mf-photo-remove {
    display: none; position: absolute; top: 8px; right: 8px; z-index: 4;
    background: rgba(17,17,17,0.75); color: #fff; border: 0; border-radius: 4px;
    padding: 4px 9px; font-size: 11.5px; font-family: inherit; cursor: pointer;
  }
  .mf-photo.has-image .mf-photo-remove { display: block; }
  .mf-photo-controls { display: none; align-items: center; gap: 10px; margin-top: 14px; font-size: 12px; color: var(--soft); }
  .mf-photo-controls.visible { display: flex; }
  .mf-photo-controls input[type="range"] { flex: 1; min-width: 0; accent-color: #b3263a; }
  .mf-photo-controls button {
    background: none; border: 1px dashed var(--soft); color: var(--soft); font-family: inherit;
    font-size: 11.5px; padding: 3px 9px; border-radius: 4px; cursor: pointer; white-space: nowrap;
  }
  .mf-photo-hint { display: none; margin-top: 6px; font-size: 11.5px; color: var(--soft); text-align: center; }
  .mf-photo-hint.visible { display: block; }
  .mf-photo img.dragging { cursor: grabbing; }

  @media (hover: none) { .mf-x { opacity: 0.7; } }
  @media (max-width: 680px) {
    .mf-pad { padding: 12px 8px 64px; }
    .mf-x { right: -4px; }
    .mf-row, .mf-rel, .mf-tl { padding-right: 22px; }
    .mf-toolbar { font-size: 12px; padding: 8px 10px; }
  }

  /* 조직 내 위치: 해당 없음 체크 */
  .mf-row.mf-has-off { grid-template-columns: 92px 1fr auto; }
  .mf-off { display: inline-flex; align-items: center; gap: 5px; align-self: start; padding-top: 2px; font-size: 12px; color: var(--soft); white-space: nowrap; cursor: pointer; user-select: none; }
  .mf-off input { margin: 0; accent-color: var(--red); cursor: pointer; }
  .mf-row.is-off { padding-top: 4px; padding-bottom: 4px; }
  .mf-row.is-off .mf-k { text-decoration: line-through; opacity: 0.5; }
  .mf-row.is-off .mf-v { display: none; }

  /* 꾸밈 요소 패널 */
  .mf-deco-panel { max-width: 960px; margin: 0 auto 22px; background: #ffffff; border: 1px solid #111111; border-radius: 10px; font-size: 13px; color: #111111; }
  .mf-deco-panel > summary { cursor: pointer; padding: 11px 16px; font-weight: 600; font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; list-style: none; }
  .mf-deco-panel > summary::-webkit-details-marker { display: none; }
  .mf-deco-panel > summary small { font-weight: 400; font-size: 12.5px; color: #5e5e5e; }
  .mf-deco-body { padding: 4px 16px 16px; border-top: 1px solid #d6d6d6; }
  .mf-pos { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 12px 0 10px; }
  .mf-pos span { margin-right: 4px; color: #5e5e5e; }
  .mf-pos button { background: #fff; color: #111; border: 1px solid #aaaaaa; border-radius: 999px; padding: 3px 12px; font-family: inherit; font-size: 12.5px; cursor: pointer; }
  .mf-pos button.on { background: #111111; color: #ffffff; border-color: #111111; }
  .mf-pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
  .mf-pal button { background: #1b1b1b; color: #f2f2f2; border: 0; border-radius: 8px; padding: 10px 6px 7px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 7px; font-family: inherit; font-size: 12px; }
  .mf-pal button:hover { background: #2c2c2c; box-shadow: 0 0 0 2px #b3263a; }
  .mf-pal button:focus-visible { outline: 2px solid #b3263a; outline-offset: 2px; }
  .mf-pal .ico { width: 68px; height: 42px; filter: drop-shadow(1px 0 0 #f7f7f7) drop-shadow(-1px 0 0 #f7f7f7) drop-shadow(0 1px 0 #f7f7f7) drop-shadow(0 -1px 0 #f7f7f7); }
  .mf-pal .ico svg { display: block; width: 100%; height: 100%; }
  .mf-dl-list { margin-top: 14px; display: grid; gap: 6px; }
  .mf-dl { display: grid; grid-template-columns: 84px auto 1fr 1fr 26px; gap: 8px 12px; align-items: center; padding: 6px 10px; background: #f1f1f1; border-radius: 6px; }
  .mf-dl .nm { font-weight: 600; }
  .mf-dl .snap { display: flex; gap: 4px; }
  .mf-dl .snap button { background: #fff; border: 1px solid #bbbbbb; border-radius: 4px; padding: 1px 8px; font-family: inherit; font-size: 12px; cursor: pointer; color: #111; }

<body class="mf-page">

      <button id="export-download" type="button">파일로 다운로드</button>
      <span id="export-copy-status"></span>
    </div>
  </div>
</div>

<div class="mf-toolbar">
  <b>마피아 설정노트 에디터</b>
  <span id="save-status">불러오는 중...</span>
  <div class="mf-spacer"></div>
  <button id="btn-clear" type="button">내용 비우기</button>
  <button id="btn-sample" type="button">샘플로 되돌리기</button>
  <label class="btn" for="import-file">가져오기</label>
  <input type="file" id="import-file" accept="application/json">
  <button id="btn-export" type="button">내보내기 (.json)</button>
  <button id="btn-export-html" class="primary" type="button">티스토리 HTML 추출</button>
</div>

<div class="mf-pad">

<details class="mf-deco-panel" open>
  <summary>꾸밈 요소 <small>눌러서 추가하고, 시트 위에서 끌어 옮겨 보세요. 티스토리 코드에도 그대로 들어가요.</small></summary>
  <div class="mf-deco-body">
    <div class="mf-pos">
      <span>추가할 위치</span>
      <button type="button" class="on" data-pos="left">좌하단</button>
      <button type="button" data-pos="mid">하단 중앙</button>
      <button type="button" data-pos="right">우하단</button>
    </div>
    <div class="mf-pal" id="deco-palette"></div>
    <div class="mf-dl-list" id="deco-list"></div>
  </div>
</details>

<div class="mf-scene" id="sheet">
  <div class="mf-stack s2"></div>
  <div class="mf-stack s1"></div>

  <div class="mf-wrap">
    <div class="mf-tab">
      <div class="mf-family" data-edit data-single data-key="family" data-placeholder="패밀리 이름"></div>
    </div>

    <div class="mf-paper">
      <div class="mf-status" id="status" data-cycle="status" data-status="active" role="button" tabindex="0" title="눌러서 상태 바꾸기"><span id="status-text">현역</span></div>

      <div class="mf-body">

        <div class="mf-id">
          <div class="mf-portrait-col">
            <div class="mf-portrait">
              <div class="mf-chip tl" data-suit="spade">

                <span class="mf-suit" data-cycle="suit" role="button" tabindex="0" title="눌러서 문양 바꾸기">♠︎</span>
              </div>
              <div class="mf-photo" id="photo-frame" tabindex="0">
                <img id="photo-img" alt="캐릭터 이미지" draggable="false">
                <div class="mf-upload-caption mf-ui"><b>사진 올리기</b><span>눌러서 이미지를 선택하세요</span></div>
                <button class="mf-photo-remove mf-ui" id="photo-remove" type="button">사진 제거</button>
              </div>
              <div class="mf-chip br" data-suit="spade" aria-hidden="true">
                <div class="mf-rank" data-mirror="rank"></div>
                <span class="mf-suit">♠︎</span>
              </div>
            </div>
            <input type="file" id="photo-input" accept="image/*" class="mf-ui">
            <div class="mf-photo-controls mf-ui" id="photo-controls">

              <span>확대</span>

            </div>

          <div class="mf-id-main">
            <div class="mf-namebox">

            <div class="mf-quote" data-edit data-key="quote" data-placeholder="대표 대사"></div>
            <div class="mf-ledger" id="list-info"></div>
            <button class="mf-add mf-ui" type="button" data-add="info">+ 줄 추가</button>
          </div>
        </div>

        <div class="mf-cols">
          <div class="mf-col">
            <div class="mf-section" data-prune>
              <div class="mf-h">조직 내 위치</div>
              <div class="mf-ledger" id="list-org"></div>
              <button class="mf-add mf-ui" type="button" data-add="org">+ 줄 추가</button>
            </div>

            <div class="mf-section" data-prune>
              <div class="mf-h">인간관계</div>
              <div class="mf-rels" id="list-rel"></div>
              <button class="mf-add mf-ui" type="button" data-add="rel">+ 관계 추가</button>
            </div>

            <div class="mf-section" data-prune>
              <div class="mf-h">연대기</div>
              <div class="mf-tls" id="list-time"></div>
              <button class="mf-add mf-ui" type="button" data-add="time">+ 사건 추가</button>
            </div>
          </div>

          <div class="mf-col">
            <div class="mf-section" data-prune>
              <div class="mf-h">전투와 특기</div>
              <div class="mf-ledger" id="list-combat"></div>
              <button class="mf-add mf-ui" type="button" data-add="combat">+ 줄 추가</button>
            </div>

            <div class="mf-section" data-prune>
              <div class="mf-h">소지품</div>
              <div class="mf-text" data-edit data-key="items" data-placeholder="늘 몸에 지니는 물건을 적어주세요"></div>
            </div>

            <div class="mf-section">
              <div class="mf-h mf-ui">파라미터</div>
              <svg class="mf-hex" id="hex" viewBox="0 0 360 340" role="img" aria-label="능력치 육각형 차트"></svg>
              <div class="mf-ui">

              </div>
            </div>
          </div>
        </div>

        <div id="list-custom"></div>
        <button class="mf-add mf-add-custom mf-ui" type="button" data-add="custom">+ 항목 추가</button>

        <div class="mf-section" data-prune>

        </div>

      </div>

      <div class="mf-foot">
        <span data-mirror="family"></span>
        <span>설정노트</span>
      </div>
    </div>
  </div>

  <div class="mf-decos" id="decos"></div>
</div>
</div>

  // ---------- 편집 모드 (일반 텍스트만 입력되게) ----------
  var EDIT_MODE = 'true';
  try {
    var probe = document.createElement('div');
    probe.contentEditable = 'plaintext-only';
    if (probe.contentEditable === 'plaintext-only') EDIT_MODE = 'plaintext-only';
  } catch (e) {}

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function getText(el) {
    var t = el.innerText;
    if (t == null) t = el.textContent;
    return t.replace(/\n+$/, '');
  }
  function setText(el, v) { el.textContent = (v == null) ? '' : String(v); }

  function scheduleSave() {
    statusEl.textContent = '입력 중...';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 600);
  }

  function onInput() {
    var el = this;
    if (el.textContent === '' && el.innerHTML !== '') el.innerHTML = '';
    if (el.hasAttribute('data-max')) {
      var m = parseInt(el.getAttribute('data-max'), 10);
      if (el.textContent.length > m) el.textContent = el.textContent.slice(0, m);
    }
    syncMirrors();
    scheduleSave();
  }
  function onKey(e) {
    if (e.key === 'Enter' && this.hasAttribute('data-single')) e.preventDefault();
  }
  function onPaste(e) {
    var single = this.hasAttribute('data-single');
    if (EDIT_MODE === 'plaintext-only' && !single) return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    if (single) text = text.replace(/\s*\n\s*/g, ' ');
    document.execCommand('insertText', false, text);
  }
  function arm(root) {
    root.querySelectorAll('[data-edit]').forEach(function (el) {
      el.setAttribute('contenteditable', EDIT_MODE);
      if (el._mf) return;
      el._mf = true;
      el.addEventListener('input', onInput);
      el.addEventListener('keydown', onKey);
      el.addEventListener('paste', onPaste);
    });
  }

  function syncMirrors() {
    sheet.querySelectorAll('[data-mirror]').forEach(function (el) {
      var src = sheet.querySelector('[data-key="' + el.getAttribute('data-mirror') + '"]');
      el.textContent = src ? getText(src) : '';
    });
  }

  };

  function makeRow(name, item) {
    var cfg = LISTS[name];
    var holder = document.createElement('div');
    holder.innerHTML = cfg.tpl;
    var row = holder.firstElementChild;
    cfg.fields.forEach(function (f) {
      var el = row.querySelector('[data-f="' + f + '"]');
      if (el) setText(el, item && item[f]);
    });
    var x = row.querySelector('.mf-x');
    if (x) x.addEventListener('click', function () { row.remove(); scheduleSave(); });
    if (cfg.hideable) {
      row.classList.add('mf-has-off');
      var lab = document.createElement('label');
      lab.className = 'mf-off mf-ui';
      lab.title = '해당 없음: 체크하면 이 줄이 숨겨지고, 티스토리 코드에도 들어가지 않아요';
      lab.innerHTML = '<input type="checkbox"> 없음';
      var cb = lab.firstChild;
      cb.checked = !!(item && item.off);
      row.classList.toggle('is-off', cb.checked);
      cb.addEventListener('change', function () {
        row.classList.toggle('is-off', cb.checked);
        scheduleSave();
      });
      row.insertBefore(lab, x);
    }
    arm(row);
    return row;
  }
  function fillList(name, items) {
    var cfg = LISTS[name];
    cfg.el.innerHTML = '';
    (items || []).forEach(function (it) { cfg.el.appendChild(makeRow(name, it)); });
  }
  function collectList(name) {
    var cfg = LISTS[name], out = [];
    Array.prototype.forEach.call(cfg.el.children, function (row) {
      var o = {};
      cfg.fields.forEach(function (f) {
        var el = row.querySelector('[data-f="' + f + '"]');
        o[f] = el ? getText(el) : '';
      });
      if (cfg.hideable) o.off = row.classList.contains('is-off');
      out.push(o);
    });
    return out;
  }
  function blankList(name) {
    if (LABELS[name]) return LABELS[name].map(function (l) { return { k: l, v: '' }; });
    if (name === 'custom') return [];
    return [{}];
  }

  var statWrap = $('stat-rows');

  function getMax() {
    var n = parseFloat(maxInput.value);
    return n > 0 ? n : 10;
  }
  function clampVal(v) {
    var n = parseFloat(v);
    if (isNaN(n) || n < 0) n = 0;
    var m = getMax();
    if (n > m) n = m;
    return Math.round(n * 10) / 10;
  }
  function fmt(n) { return String(Math.round(n * 10) / 10); }
  function gradeOf(v, max) {
    var r = v / max;
    return r >= 0.9 ? 'S' : r >= 0.75 ? 'A' : r >= 0.55 ? 'B' : r >= 0.35 ? 'C' : r >= 0.15 ? 'D' : 'E';
  }

  function buildStatRows() {
    statWrap.innerHTML = '';
    for (var i = 0; i < 6; i++) {
      var r = document.createElement('div');
      r.className = 'mf-stat-row';
      r.innerHTML =
        '<input class="mf-stat-label" type="text" maxlength="8" placeholder="항목" aria-label="능력치 이름 ' + (i + 1) + '">' +
        '<input class="mf-stat-val" type="number" min="0" step="any" inputmode="decimal" aria-label="능력치 수치 ' + (i + 1) + '">' +
        '<span class="mf-grade"></span>';
      statWrap.appendChild(r);

  function drawHex(labels, vals, max) {
    var cx = 180, cy = 168, R = 108, out = '', i, k;
    function P(idx, r) {
      var a = -Math.PI / 2 + idx * Math.PI / 3;
      return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    }
    function S(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }
    for (k = 5; k >= 1; k--) {
      var ring = [];
      for (i = 0; i < 6; i++) ring.push(S(P(i, R * k / 5)));
      out += '<polygon class="mf-hex-ring' + (k === 5 ? ' is-outer' : '') + '" points="' + ring.join(' ') + '"/>';
    }
    for (i = 0; i < 6; i++) {
      var e = P(i, R);
      out += '<line class="mf-hex-axis" x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '"/>';
    }
    var area = [];
    for (i = 0; i < 6; i++) area.push(P(i, R * (vals[i] / max)));
    out += '<polygon class="mf-hex-area" points="' + area.map(S).join(' ') + '"/>';
    area.forEach(function (p) {
      out += '<circle class="mf-hex-dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.6"/>';
    });
    for (i = 0; i < 6; i++) {
      var q = P(i, R + 34);
      out += '<text class="mf-hex-label" x="' + q[0].toFixed(1) + '" y="' + (q[1] - 3).toFixed(1) + '">' + esc(labels[i]) + '</text>' +
             '<text class="mf-hex-num" x="' + q[0].toFixed(1) + '" y="' + (q[1] + 16).toFixed(1) + '">' + fmt(vals[i]) + '</text>';
    }
    hexSvg.innerHTML = out;
  }

    var reader = new FileReader();

      var im = new Image();
      im.onload = function () {
        var max = 900, s = Math.min(1, max / Math.max(im.width, im.height));
        var c = document.createElement('canvas');
        c.width = Math.round(im.width * s);
        c.height = Math.round(im.height * s);
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(im, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.85));
      };
      im.onerror = function () { cb(reader.result); };
      im.src = reader.result;
    };
    reader.readAsDataURL(file);

  function addHandles(el, d) {
    function mk(cls, txt, title) {
      var b = document.createElement('div');
      b.className = 'mf-hd mf-ui ' + cls; b.title = title; if (txt) b.textContent = txt;
      b.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      el.appendChild(b); return b;
    }
    function center() { var r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
    function drag(b, onMove) {
      var on = false;
      b.addEventListener('pointerdown', function (e) { on = true; b.setPointerCapture(e.pointerId); e.preventDefault(); e.stopPropagation(); });
      b.addEventListener('pointermove', function (e) { if (on) { onMove(e); clampDeco(d); placeDeco(el, d); } });
      function end() { if (!on) return; on = false; renderDecoList(); scheduleSave(); }
      b.addEventListener('pointerup', end); b.addEventListener('pointercancel', end);

    var rot = mk('rot', '', '돌리기');
    drag(rot, function (e) {

    Object.keys(LISTS).forEach(function (n) {
      var arr = d.lists && d.lists[n];
      if (n === 'org' && Array.isArray(arr) && !arr.some(function (r) { return r && r.k === '파트너'; })) {
        arr = arr.slice();
        var at = 0;
        arr.forEach(function (r, i) { if (r && r.k === '직속 부하') at = i + 1; });
        arr.splice(at || Math.min(3, arr.length), 0, { k: '파트너', v: '' });
      }
      fillList(n, Array.isArray(arr) ? arr : blankList(n));
    });
    var rawDecos = Array.isArray(d.decos) ? d.decos : (d.decos === undefined ? SAMPLE.decos : []);
    decos = [];
    rawDecos.forEach(function (c) {
      if (!c || !DECOS[c.type]) return;
      var item = { id: 'dc' + (++decoUid), type: c.type, x: c.x, y: c.y, rot: c.rot, scale: c.scale, seed: parseInt(c.seed, 10) || 1 };
      clampDeco(item);
      decos.push(item);
    });
    renderDecos();
    maxInput.value = d.statMax > 0 ? d.statMax : 10;
    var st = Array.isArray(d.stats) ? d.stats : [];
    Array.prototype.forEach.call(statWrap.children, function (r, i) {
      var inp = r.querySelectorAll('input');
      inp[0].value = (st[i] && st[i].label != null) ? st[i].label : STAT_DEFAULT[i];
      inp[1].value = (st[i] && st[i].value != null) ? st[i].value : 5;
    });
    suitIdx = indexOfKey(SUITS, d.suit);
    statusIdx = indexOfKey(STATUSES, d.status);
    var p = d.photo || {};
    photo.src = (typeof p.src === 'string' && p.src.indexOf('data:image/') === 0) ? p.src : '';
    photo.zoom = parseFloat(p.zoom) || 1;
    photo.x = parseFloat(p.x) || 0;
    photo.y = parseFloat(p.y) || 0;
    renderSuit();
    renderStatus();
    renderPhoto();
    renderStats();
    syncMirrors();
  }

  function saveNow() {
    try {
      localStorage.setItem(KEY, JSON.stringify(collect()));
      var now = new Date();
      statusEl.textContent = '자동 저장됨 · ' + now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    } catch (err) {
      statusEl.textContent = '저장 실패 (브라우저 저장 공간을 쓸 수 없거나 용량 초과)';
    }
  }

  // ---------- 초기화 ----------
  buildStatRows();
  arm(sheet);
  (function init() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) {}
    if (raw) {
      try {
        var saved = JSON.parse(raw);
        if (saved && saved.lists && Array.isArray(saved.lists.custom)) {
          saved.lists.custom = saved.lists.custom.filter(function (c) { return c.title !== '습관과 버릇'; });
        }
        apply(saved);
        statusEl.textContent = '이전에 저장된 내용을 불러왔습니다';
        return;
      } catch (err) {}
    }
    apply(SAMPLE);
    statusEl.textContent = '샘플 내용입니다. "내용 비우기"로 새로 시작하세요';
  })();

  $('btn-clear').addEventListener('click', function () {
    if (!confirm('모든 내용을 비울까요? 저장된 내용도 함께 지워집니다.')) return;
    apply(blankData());
    saveNow();
  });
  $('btn-sample').addEventListener('click', function () {
    if (!confirm('샘플 내용으로 되돌릴까요? 지금 작성한 내용은 사라집니다.')) return;
    apply(SAMPLE);
    saveNow();
  });

  // ---------- 내보내기 (.json) / 가져오기 ----------
  function safeName() {
    var n = sheet.querySelector('[data-key="name"]');
    var raw = n ? getText(n).trim() : '';
    return (raw || 'character').replace(/[\\/:*?"<>|]/g, '').slice(0, 30);
  }
  function download(filename, text, type) {
    var blob = new Blob([text], { type: type });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
  $('btn-export').addEventListener('click', function () {
    download(safeName() + '-설정노트.json', JSON.stringify(collect(), null, 2), 'application/json');
  });
  $('import-file').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        apply(JSON.parse(reader.result));
        saveNow();
        statusEl.textContent = '파일에서 불러왔습니다';
      } catch (err) {
        alert('파일을 읽지 못했습니다. 이 에디터에서 내보낸 .json 파일인지 확인해주세요.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  // ---------- 티스토리용 HTML 추출 ----------
  function hasText(el) { return !!(el && el.textContent.trim()); }

  function buildExport() {
    sheet.querySelectorAll('input').forEach(function (i) { i.setAttribute('value', i.value); });
    var clone = sheet.cloneNode(true);

    clone.querySelectorAll('.mf-ui').forEach(function (el) { el.remove(); });
    clone.querySelectorAll('.mf-has-off').forEach(function (el) { el.classList.remove('mf-has-off'); });

    // 해당 없음으로 체크한 줄은 티스토리 코드에 넣지 않음
    clone.querySelectorAll('.mf-row.is-off').forEach(function (r) { r.remove(); });

    // 비어 있는 줄 정리
    clone.querySelectorAll('.mf-row').forEach(function (r) {
      if (!hasText(r.querySelector('[data-f="v"]'))) r.remove();
    });
    clone.querySelectorAll('.mf-rel').forEach(function (r) {
      if (!hasText(r.querySelector('[data-f="name"]'))) r.remove();
    });
    clone.querySelectorAll('.mf-tl').forEach(function (r) {
      if (!hasText(r.querySelector('[data-f="title"]')) && !hasText(r.querySelector('[data-f="text"]'))) r.remove();
    });
    clone.querySelectorAll('.mf-custom').forEach(function (s) {
      if (!hasText(s.querySelector('[data-f="body"]'))) s.remove();
    });
    clone.querySelectorAll('[data-prune]').forEach(function (sec) {
      var fields = sec.querySelectorAll('[data-key], [data-f]');
      var any = Array.prototype.some.call(fields, function (el) {
        return !el.hasAttribute('data-nocount') && hasText(el);
      });
      if (!any) sec.remove();
    });
    ['.mf-callsign', '.mf-roman', '.mf-catch', '.mf-quote', '.mf-stat-note'].forEach(function (sel) {
      var el = clone.querySelector(sel);
      if (el && !hasText(el)) el.remove();
    });
    var ledgerEmpty = clone.querySelector('.mf-id-main .mf-ledger');
    if (ledgerEmpty && !ledgerEmpty.children.length) ledgerEmpty.remove();

    // 입력칸은 글자로 바꾸기
    clone.querySelectorAll('input').forEach(function (i) {
      var s = document.createElement('span');
      s.className = i.className;
      s.textContent = i.getAttribute('value') || '';
      i.parentNode.replaceChild(s, i);
    });

    // 편집용 속성 제거
    clone.removeAttribute('id');
    ['contenteditable', 'data-edit', 'data-single', 'data-placeholder', 'data-max', 'data-f', 'data-key',
     'data-nocount', 'data-prune', 'data-mirror', 'data-cycle', 'data-deco', 'role', 'tabindex', 'title', 'id', 'draggable'].forEach(function (a) {
      clone.querySelectorAll('[' + a + ']').forEach(function (el) { el.removeAttribute(a); });
    });
    var im = clone.querySelector('.mf-photo img');
    if (im && !im.getAttribute('src')) im.remove();
    else if (im) im.removeAttribute('class');

    var styleTag = document.getElementById('mf-core-style').outerHTML;
    var fontLinks =
      '<link rel="preconnect" href="https://fonts.googleapis.com">' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
      '<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">';
    return '<!-- 티스토리 HTML 편집 모드에 이 코드 전체를 붙여넣으세요 -->\n' + fontLinks + '\n' + styleTag + '\n' + clone.outerHTML;
  }
  window.__mfBuildExport = buildExport;

  var modal = $('export-modal');
  var ta = $('export-textarea');
  var copyStatus = $('export-copy-status');

  $('btn-export-html').addEventListener('click', function () {
    ta.value = buildExport();
    copyStatus.textContent = '';
    modal.classList.remove('hidden');
    ta.focus();
    ta.select();
  });
  $('export-close').addEventListener('click', function () { modal.classList.add('hidden'); });
  modal.addEventListener('click', function (e) { if (e.target === modal) modal.classList.add('hidden'); });
  $('export-copy').addEventListener('click', function () {
    var text = ta.value;
    function fallback() {
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      copyStatus.textContent = ok ? '복사되었습니다!' : '복사에 실패했습니다. 텍스트를 직접 선택해서 복사해주세요.';
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { copyStatus.textContent = '복사되었습니다!'; }, fallback);
    } else {
      fallback();
    }
  });
  $('export-download').addEventListener('click', function () {
    download(safeName() + '-tistory.html', ta.value || buildExport(), 'text/html');
  });
})();
</script>

</body>
</html>
